name: Android CI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease -P version=${{ github.ref_name }}

      - name: Sign Normal APK
        id: sign_normal_apk
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: app/build/outputs/apk/normal/release/
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Sign Compatible APK
        id: sign_compatible_apk
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: app/build/outputs/apk/compatible/release/
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      - name: Extract APK Base Name
        run: |
          echo "NORMAL_APK_BASE_NAME=$(basename -s "-signed.apk" ${{ steps.sign_normal_apk.outputs.signedFile }})" >> $GITHUB_ENV
          echo "COMPATIBLE_APK_BASE_NAME=$(basename -s "-signed.apk" ${{ steps.sign_compatible_apk.outputs.signedFile }})" >> $GITHUB_ENV

      - name: Upload Normal to Release
        uses: termux/upload-release-action@v4.2.0
        with:
          asset_name: ${{ env.NORMAL_APK_BASE_NAME }}.apk
          file: ${{ steps.sign_normal_apk.outputs.signedFile }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
          checksums: sha256
          checksums_file_name: CHECKSUMS-${{ env.NORMAL_APK_BASE_NAME }}.%algo%

      - name: Upload Compatible to Release
        uses: termux/upload-release-action@v4.2.0
        with:
          asset_name: ${{ env.COMPATIBLE_APK_BASE_NAME }}.apk
          file: ${{ steps.sign_compatible_apk.outputs.signedFile }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
          checksums: sha256
          checksums_file_name: CHECKSUMS-${{ env.COMPATIBLE_APK_BASE_NAME }}.%algo%